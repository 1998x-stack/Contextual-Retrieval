[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contextual-retrieval-lab"
version = "0.1.0"
description = "Reproducible Contextual Retrieval experiments"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
voyage = ["voyageai>=0.3,<1"]
anthropic = ["anthropic>=0.49,<1"]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]

[project.scripts]
crlab = "crlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
